sonar:
  threshold: 0.75
  code_paths: [demo/shopfront]
  min_words: 6
storm:
  max_rounds: 3
  default_mode: auto
autonomy:
  brief: human
  pick: human
  merge: human
  storm_result: human
rooms:
  requests: kraken-requests
  hallmark: kraken-hallmark
charter:
  max_bidders: 5
bidders: [claude-coder, claude-coder-2, claude-coder-3]
timeouts_s:
  spark: 1800
  charter: 900
  forge: 3600
  storm: 1800
db_path: kraken.db
relay_port: 8765
kraken_agent: kraken
# Your chat-app (Mattermost/Discord) usernames: added to every room Kraken opens
# (Spark, Sonar, Charter, Forge, Storm) so you can answer its prompts.
people: [anish_2007]
# The messaging app those rooms go on: a Switch connection's display name.
# Leave it out to use the server's default app.
bridge: Dc Switch
agents:
  planner: kraken-planner
  attacker: squall
  defender: storm-defender
  coach: storm-coach
