sonar:
  threshold: 0.75
  min_words: 6
# The codebases Kraken works on. Add your own with `python -m kraken.init <path>`, or from
# chat: `@kraken connect https://github.com/you/your-repo`. The first one is the default.
projects:
  - name: shopfront
    description: Demo shop API (users, free-tier rate limits) bundled with Kraken
    language: python
    # repo left out: the crew's own Kraken checkout already contains demo/shopfront
    code_paths: [demo/shopfront]
    test: python -m pytest tests/test_shopfront.py
    run: python demo/shopfront/run.py
    base_url: http://127.0.0.1:8080
    health: /v2/users/1
    endpoints: [/v1/users/1, /v2/users/1]
    config_files: [demo/shopfront/config/limits.yaml]
    chaos_endpoint: /__chaos
# After Storm survives: pr = ask, then the coder pushes and opens a pull request;
# branch = leave the work on the coder's local branch.
deliver: pr
storm:
  max_rounds: 3
  # drill: you defend what Squall breaks; reply 🤖 in the Storm room to hand it to the defender
  default_mode: drill
# Human first: a person does each step; reply 🤖 (or "agent") in that step's room to hand
# just that step of just that request to an agent, and "me" to take it back.
# Set a key to auto to hand that step to agents for every request.
# If no person replies for human_wait_s, Kraken hands the step to the agent itself
# (0 = always wait). The pull request is never handed off.
human_wait_s: 120
autonomy:
  brief: human
  pick: human
  merge: human
  storm_result: human
rooms:
  requests: kraken-requests
  hallmark: kraken-hallmark
charter:
  max_bidders: 5
# Initial bidders. Empty on purpose: the crew template's coders are named after the
# agent you pick (claude-coder, codex-coder, ...) and join on their own at the first
# Charter (charter.auto_join), like any agent you add in Switch later.
bidders: []
timeouts_s:
  spark: 1800
  charter: 900
  forge: 3600
  storm: 1800
db_path: kraken.db
relay_port: 8765
kraken_agent: kraken
# Your chat-app (Mattermost/Discord) usernames: added to every room Kraken opens
# (Spark, Sonar, Charter, Forge, Storm) so you can answer its prompts.
people: [anish_2007]
# The messaging app those rooms go on: a Switch connection's display name.
# Leave it out to use the server's default app.
bridge: Dc Switch
agents:
  planner: kraken-planner
  attacker: squall
  defender: storm-defender
  coach: storm-coach
