version: 1
params:
  tag:
    type: string
    label: Request tag
  subject:
    type: string
    label: What the two messages disagree about
  quote_a:
    type: string
    multiline: true
  link_a:
    type: string
  user_a:
    type: string
    required: false
    label: First speaker
  quote_b:
    type: string
    multiline: true
  link_b:
    type: string
  user_b:
    type: string
    required: false
    label: Second speaker
  prompt_text:
    type: string
    multiline: true
    label: Prompt posted as the kickoff
    description: Built by Kraken, ends with the pick line.
  kraken:
    type: agent
    label: Kraken agent
    default: kraken
room:
  name: "Sonar [K-{tag}]: {subject}"
  description: "Two messages disagree about {subject}. Pick the one that is true."
  channel_type: channel_private
  agents: ["{kraken}"]
  users: ["{$creator}"]
  instructions: |
    Sonar found two messages that cannot both be true, about {subject} [K-{tag}].

    First message, from {user_a}: {link_a}
    "{quote_a}"

    Second message, from {user_b}: {link_b}
    "{quote_b}"

    Reply 1️⃣ if the first is true, 2️⃣ if the second is true, or 🙅 if they do
    not conflict. Kraken records the answer in the ledger and closes the room.
kickoff: "{prompt_text}"
