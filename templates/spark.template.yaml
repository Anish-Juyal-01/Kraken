version: 1
params:
  tag:
    type: string
    label: Request tag
    description: Request number, used in the room name and in prompts.
  request:
    type: string
    multiline: true
    label: Request
  planner:
    type: agent
    label: Planner agent
    default: kraken-planner
  owner:
    type: string
    label: Request owner
  project:
    type: string
    multiline: true
    required: false
    label: Project
    description: The codebase, built by Kraken from the project's settings.
  kraken:
    type: agent
    label: Kraken agent
    default: kraken
room:
  name: "Spark [K-{tag}]"
  description: "Turns request K-{tag} into a brief."
  channel_type: channel_private
  agents: ["{planner}", "{kraken}"]
  instructions: |
    This room turns request [K-{tag}] from {owner} into a brief that coders can bid on.

    {project}

    Look at the code before you write the brief, so the acceptance criteria name
    real files, commands and behaviour.

    Request:
    {request}

    {planner} is the planner. Work in this order:
    1. Decide whether anything must be asked. Ask only what you cannot settle
       from the request and the code and what would change what gets built (no
       fixed number, no checklist). If nothing is needed, ask nothing and go to 2.
       If something is, ask {owner} in one message and wait: {owner} answers here.
       If Kraken says the owner handed this step to you, stop waiting: choose the
       answers yourself, sensibly, and list them under "Assumptions" in the brief.
    2. Write the brief: goal, acceptance criteria (a numbered list a reviewer can
       tick off), files likely touched, assumptions, and out of scope.
    3. Create the brief as a room document named brief (create_room_document), so
       the full text lives in the room.
    4. Then post one message containing the marker line BRIEF READY.

    Marker rule: BRIEF READY goes on its own line, with nothing else on that line,
    and only once the document brief exists. Never write it earlier or in a question.
kickoff: |
  @{planner} new request [K-{tag}] from {owner}:

  {request}

  Read the code, then either ask {owner} only what you truly need to know, or,
  if the request is clear, write the brief straight away.
  ({owner}: answer here, or reply 🤖 to let the planner decide.)
