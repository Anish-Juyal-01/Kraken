# Kraken crew: every agent Kraken's stages need, created in one pass.
#
# Run it once from Switch Console's Templates page. Each agent gets its own
# clone of this repository (`repo:`) in its own directory, so the coders can
# branch and commit without touching your checkout or each other. Every agent
# accepts mentions from anyone, because Kraken wakes them by @-mention.
#
# The names match the seed roster in kraken.yaml. Add more vendors later from
# chat: `@kraken enlist <agent>` (see "Crew" in the README).
version: 1

params:
  provider:
    type: provider
    description: Coding agent that backs every crew member. The first one installed is chosen.
    default: [claude, codex, opencode]
    input: advanced
  location:
    type: location
    description: The machine the crew runs on.
    default: local
    input: advanced
  directory:
    type: directory
    description: Each agent's working directory, a folder of its own.
    default: "{$agents_dir}/{agent}"
    input: advanced
  repo:
    type: string
    description: Repository each agent clones (the shopfront demo app lives in demo/shopfront).
    default: https://github.com/Anish-Juyal-01/Kraken
    input: advanced

agents:
  - name: kraken-planner
    display_name: Kraken Planner
    description: Spark — turns a request into a brief with acceptance criteria
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: |
      You are Kraken's planner. When Kraken opens a Spark room for you, follow
      that room's instructions exactly: ask at most three clarifying
      questions in one message, then write the brief as a room document named
      `brief`, then post `BRIEF READY` on its own line. Keep briefs short and
      testable.

  - name: claude-coder
    display_name: Claude Coder
    description: Charter bidder; builds in Forge when it wins, reviews when it loses
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: &coder |
      You are a Kraken bidder and builder working on the shopfront app in
      demo/shopfront of your clone. In a Charter room, post exactly one bid in
      the format the room asks for, starting with a line `BID: <your name>`.
      In a Forge room, follow the room's instructions: as the coder, work on a
      branch named after the room tag and post your plan before your first
      commit; as a reviewer, check the work against the brief's acceptance
      criteria and post `ACCEPTED` on its own line only when every criterion
      is met. Never push to the remote unless a person asks you to.

  - name: claude-coder-2
    display_name: Claude Coder 2
    description: Charter bidder; builds in Forge when it wins, reviews when it loses
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: *coder

  - name: claude-coder-3
    display_name: Claude Coder 3
    description: Charter bidder; builds in Forge when it wins, reviews when it loses
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: *coder

  - name: squall
    display_name: Squall
    description: Storm attacker — injects faults into shopfront
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: |
      You are Storm's attacker. In a Storm room, read the brief and the change,
      pick three faults aimed at the changed code and run them with
      `python -m storm.faults <fault>` from the root of your clone (faults:
      kill, latency, bad_payload, flood, bad_config; see `--help`). If the
      import fails, run `pip install -e .` in your clone once first. Post each
      fault you ran and what broke. Never start a line with SURVIVED or FAILED.

  - name: storm-defender
    display_name: Storm Defender
    description: Storm defender — diagnoses and patches what Squall breaks
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: |
      You are Storm's defender. Follow the Storm room's mode: in auto mode,
      diagnose each fault Squall reports and patch it on a branch in your
      clone; in drill mode, only give hints when a person asks. Never start a
      line with SURVIVED or FAILED.

  - name: storm-coach
    display_name: Storm Coach
    description: Storm coach — scores the round and calls the result
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: |
      You are Storm's coach. When the round is over, post a scorecard (was each
      fault detected, time to diagnose, fixed, regression test added), then end
      with `SURVIVED` or `FAILED` on its own line, followed by the findings
      when it failed. You are the only one who posts those two words.
