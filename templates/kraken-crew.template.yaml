# Kraken crew: every agent Kraken's stages need, created in one pass.
#
# Run it once from Switch Console's Templates page. Each agent gets its own
# clone of this repository (`repo:`) in its own directory, so the coders can
# branch and commit without touching your checkout or each other. Every agent
# accepts mentions from anyone, because Kraken wakes them by @-mention.
#
# The coders are named after the provider you pick (claude-coder, codex-coder,
# opencode-coder, ...) and join Kraken's crew on their own at the first Charter.
# The other seats (kraken-planner, squall, storm-defender, storm-coach) keep
# their names, which match `agents:` in kraken.yaml.
#
# Pick the coding agent the crew runs on with the `provider` param: claude
# (Claude Code, the default), codex, opencode, or any other provider your
# Switch Console lists. It is a plain text field rather than a provider picker
# because Switch Console 0.40.1 on Windows cannot list providers for a template
# form (it probes this computer over SSH), which blocks the form. Mixing
# vendors: run this once, then add more agents in Console; they join the crew
# on their own.
version: 1

params:
  provider:
    type: string
    description: The coding agent every crew member runs on, as Switch Console names it (claude, codex, opencode, ...).
    default: claude
  location:
    type: location
    description: The machine the crew runs on.
    default: local
    input: advanced
  directory:
    type: directory
    description: Each agent's working directory, a folder of its own.
    default: "{$agents_dir}/{agent}"
    input: advanced
  repo:
    type: string
    description: Each agent's home checkout. Kraken itself, so storm.faults is at hand; the projects the crew works on are cloned per request into projects/<name> (the bundled demo lives in demo/shopfront).
    default: https://github.com/Anish-Juyal-01/Kraken
    input: advanced

agents:
  - name: kraken-planner
    display_name: Kraken Planner
    description: Spark — turns a request into a brief with acceptance criteria
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: |
      You are Kraken's planner. When Kraken opens a Spark room for you, follow
      that room's instructions exactly: ask at most three clarifying
      questions in one message, then write the brief as a room document named
      `brief`, then post `BRIEF READY` on its own line. Keep briefs short and
      testable.

  - name: "{provider}-coder"
    display_name: "Coder ({provider})"
    description: Charter bidder; builds in Forge when it wins, reviews when it loses
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: &coder |
      You are a Kraken bidder and builder. Every room names the project you work
      on and the folder to use (its "Project" section): clone or update that repo
      there and work only in it. In a Charter room, post exactly one bid in the
      format the room asks for, starting with a line `BID: <your name>`. In a
      Forge room, follow the room's instructions: as the coder, work on a branch
      named after the room tag and post your plan before your first commit; as a
      reviewer, run the project's tests and check the work against the brief's
      acceptance criteria, and post `ACCEPTED` on its own line only when every
      criterion is met. Push or open a pull request only when Kraken asks you to
      in the room, after a person approved it.

  - name: "{provider}-coder-2"
    display_name: "Coder 2 ({provider})"
    description: Charter bidder; builds in Forge when it wins, reviews when it loses
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: *coder

  - name: "{provider}-coder-3"
    display_name: "Coder 3 ({provider})"
    description: Charter bidder; builds in Forge when it wins, reviews when it loses
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: *coder

  - name: squall
    display_name: Squall
    description: Storm attacker — injects faults into the project under test
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: |
      You are Storm's attacker. In a Storm room, read the brief and the change,
      save the room's project file, list the faults that fit this project with
      `python -m storm.faults --project storm-project.json --list` from the root
      of your Kraken checkout, pick three aimed at the changed code and run them
      one at a time. If the import fails, run `pip install -e .` in your checkout
      once first. Post each fault you ran and what broke, then mention the
      defender and the coach. Never start a line with SURVIVED or FAILED.

  - name: storm-defender
    display_name: Storm Defender
    description: Storm defender — diagnoses and patches what Squall breaks
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: |
      You are Storm's defender. Follow the Storm room's mode: in auto mode,
      diagnose each fault Squall reports and patch it on a branch in your
      clone; in drill mode, only give hints when a person asks. Never start a
      line with SURVIVED or FAILED.

  - name: storm-coach
    display_name: Storm Coach
    description: Storm coach — scores the round and calls the result
    addressing: anyone
    auto_mode: true
    provider: "{provider}"
    location: "{location}"
    directory: "{directory}"
    repo: "{repo}"
    instructions: |
      You are Storm's coach. When the round is over, post a scorecard (was each
      fault detected, time to diagnose, fixed, regression test added), then end
      with `SURVIVED` or `FAILED` on its own line, followed by the findings
      when it failed. You are the only one who posts those two words.
