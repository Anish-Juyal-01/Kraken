# Kraken HQ: the two standing rooms. Create once from Switch Console.
version: 1
params:
  chat:
    type: bridge
    label: Chat app
    description: Messaging app the rooms go on (a Switch connection's name). Empty uses the server's default.
    required: false
  requests:
    type: string
    label: Requests room name
    default: kraken-requests
  hallmark:
    type: string
    label: Hallmark room name
    default: kraken-hallmark
  kraken:
    type: agent
    label: Kraken agent
    default: kraken
group:
  name: Kraken
  description: Kraken turns a chat request into a planned, built and stress-tested change.
rooms:
  - name: "{requests}"
    description: Ask Kraken for work here, for example "@kraken build password reset".
    channel_type: channel_private
    bridge: "{chat}"
    agents: ["{kraken}"]
    users: ["{$creator}"]
    instructions: |
      Team requests go here. Kraken opens one room per stage of each request.
    kickoff: |
      This is the Kraken requests room. Mention @kraken with what you want built.
  - name: "{hallmark}"
    description: The decision ledger. Kraken keeps it as the room document Hallmark.
    channel_type: channel_private
    bridge: "{chat}"
    agents: ["{kraken}"]
    users: ["{$creator}"]
    instructions: |
      Kraken keeps the decision ledger in this room as one room document named
      Hallmark, and rewrites it whenever a decision is settled. Read it there.
    kickoff: |
      This is the Kraken Hallmark room. Settled decisions are kept in the Hallmark room document.
